@keyframes matrix-fall {
  0% {

  }

  100% {
    opacity: 0.5;
  }

  50% {
    opacity: 1;
  }

.pause-animations {

}

.group:hover .pause-animations {

}

.low-performance .animate-pulse,

  animation: none !important;
}

/* Targets ONLY decorative/ambient animations. Critical UI feedback (loaders, buttons) is preserved. */
/* Note: Framer Motion respects prefers-reduced-motion natively — no override needed for it. */
@media (prefers-reduced-motion: reduce) {
  /* Decorative infinite loops: safe to kill */
  .animate-breathe,
  .animate-micro-rotate,
  .animate-pulse-slow,
  .animate-float-particle {
    animation: none !important;
    transition-duration: 0.01ms !important;
  }

  /* Ambient aura background animation */
  .aura-zen-white {
    animation: none !important;
  }

  /* Particle / matrix rain systems: heavy and decorative */
  .theme-aware-symbol,
  [class*="animate-float"] {
    animation: none !important;
    opacity: 0 !important;
  }

  /* Smooth scroll: auto is better for motion-sensitive users */
  html {
    scroll-behavior: auto !important;
  }

}</style><style type="text/css" data-vite-dev-id="C:/Users/l_her/naos-platform/client/src/pages/RelationshipLaboratory.css">/* RIP Global Variables */
:root {
    --rip-bg: #0a0a0c;
    --rip-panel: rgba(20, 20, 24, 0.7);
    --rip-accent: #6d5dfc;
    --rip-accent-glow: rgba(109, 93, 252, 0.4);
    --rip-text: #e0e0e0;
    --rip-text-muted: #888899;
    --rip-border: rgba(255, 255, 255, 0.05);
}

.rip-container {
    min-height: 100vh;
    background-color: var(--rip-bg);
    color: var(--rip-text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    position: relative;
    overflow: hidden;
}

.rip-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle at 50% 0%, rgba(109, 93, 252, 0.05), transparent 70%);
    pointer-events: none;
}

.dashboard-layout {
    display: flex;
    flex-direction: row;
    height: 100vh;
}

/* Sidebar */
.rip-sidebar {
    width: 320px;
    background: rgba(10, 10, 12, 0.8);
    border-right: 1px solid var(--rip-border);
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
    overflow-y: auto;
    backdrop-filter: blur(20px);
    z-index: 10;
}

.rip-title-wrapper {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 2rem;
}

.rip-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: #fff;
    margin: 0;
    letter-spacing: -0.02em;
}

.rip-badge {
    background: rgba(109, 93, 252, 0.1);
    color: var(--rip-accent);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}

.sidebar-radar {
    margin-bottom: 2rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--rip-border);
    transform: scale(0.9);
}

.sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.nav-btn {
    background: transparent;
    border: none;
    color: var(--rip-text-muted);
    text-align: left;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
}

.nav-btn:hover {
    background: rgba(255, 255, 255, 0.03);
    color: var(--rip-text);
}

.nav-btn.active {
    background: rgba(255, 255, 255, 0.05);
    color: #fff;
    font-weight: 500;
}

.nav-btn.highlight {
    margin-top: 1rem;
    color: var(--rip-accent);
    border: 1px solid rgba(109, 93, 252, 0.2);
}

.nav-btn.highlight.active {
    background: var(--rip-accent);
    color: #fff;
}

/* Main Content */
.rip-main {
    flex: 1;
    padding: 3rem 4rem;
    overflow-y: auto;
    position: relative;
    max-width: 900px;
}

/* Executive View */
.executive-view h2 {
    font-size: 1.8rem;
    font-weight: 500;
    color: #fff;
    margin: 0 0 2rem 0;
}

.executive-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 3rem;
}

.exec-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--rip-border);
    border-radius: 12px;
    padding: 1.5rem;
}

.exec-card h4 {
    margin: 0 0 0.5rem 0;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--rip-text-muted);
}

.exec-card p {
    margin: 0;
    font-size: 1.1rem;
    color: #fff;
    line-height: 1.5;
}

.exec-card.highlight {
    background: rgba(109, 93, 252, 0.05);
    border-color: rgba(109, 93, 252, 0.2);
}

.exec-card.highlight h4 {
    color: var(--rip-accent);
}

.exec-card.warning {
    background: rgba(248, 113, 113, 0.05);
    border-color: rgba(248, 113, 113, 0.2);
}

.exec-card.warning h4 {
    color: #f87171;
}

/* Context Compatibility */
.context-compat-section h3 {
    font-size: 1.2rem;
    color: #fff;
    margin: 0 0 1.5rem 0;
}

.context-bars {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.context-bar-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.context-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    color: var(--rip-text);
}

.context-track {
    height: 6px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 3px;
    overflow: hidden;
}

.context-fill {
    height: 100%;
    background: var(--rip-accent);
    border-radius: 3px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Scanner Overlay */
.scanner-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--rip-bg);
    z-index: 100;
}

.scanner-overlay p {
    margin-top: 2rem;
    color: var(--rip-accent);
    font-size: 1rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
}

.error-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100vh;
}

.error-view h2 {
    color: #f87171;
}

/* Animations */
.animate-in { animation-fill-mode: both; }
.fade-in { animation-name: fadeIn; }
.slide-in-from-right-4 { animation-name: slideInRight; }
.duration-500 { animation-duration: 500ms; }
.duration-300 { animation-duration: 300ms; }

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
}

/* Pulse Ring Animation */
.pulse-ring {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px solid var(--rip-accent);
    position: relative;
}

.pulse-ring::before,
.pulse-ring::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 2px solid var(--rip-accent);
    opacity: 0;
    animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
}

.pulse-ring::after {
    animation-delay: 1s;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(2); opacity: 0; }
}

@media (max-width: 768px) {
    .dashboard-layout {
        flex-direction: column;
    }
    .rip-sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--rip-border);
    }
    .rip-main {
        padding: 2rem;
    }
}

    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--rip-border);
    padding: 1rem 1.25rem;
    border-radius: 8px;
    color: var(--rip-text);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
}

.scenario-tab:hover {
    background: rgba(255, 255, 255, 0.06);
}

.scenario-tab.active {
    background: rgba(109, 93, 252, 0.15);
    border-color: var(--rip-accent);
}

.scenario-title {
    font-size: 1rem;
    font-weight: 500;
}

.scenario-prob {
    font-size: 0.85rem;
    color: var(--rip-accent);
    font-weight: 600;
}

.scenario-content {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--rip-border);
    border-radius: 12px;
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

.scenario-summary p {
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0;
    color: #fff;
}

.scenario-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
}

.scenario-column h3 {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 1rem 0;
}

.scenario-column.strengths h3 {
    color: #4ade80;
}

.scenario-column.risks h3 {
    color: #f87171;
}

.scenario-column ul, .scenario-action-plan ul {
    margin: 0;
    padding-left: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.scenario-action-plan {
    border-top: 1px solid var(--rip-border);
    padding-top: 1.5rem;
}

.scenario-action-plan h3 {
    color: var(--rip-accent);
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 1rem 0;
}

@media (max-width: 768px) {
    .scenario-grid {
        grid-template-columns: 1fr;
    }
}
