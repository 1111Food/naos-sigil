name: Sigil proactive privacy checks

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/sigil-proactive-privacy.yml"
  push:
    branches:
      - "fix/sigil-proactive-log-privacy"
    paths:
      - "server/**"
      - ".github/workflows/sigil-proactive-privacy.yml"

permissions:
  contents: read

jobs:
  proactive-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify proactive log privacy and security regression
        run: npx vitest run src/test/proactiveLogPrivacy.test.ts src/test/privacyLogAudit.test.ts src/test/authorizationIntegrity.test.ts
